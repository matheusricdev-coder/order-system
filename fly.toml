# fly.toml app configuration file generated for ordem-system-api on 2026-02-18T22:48:36-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ordem-system-api'
primary_region = 'gru'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.3'

[env]
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'error'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'database'
  SESSION_SECURE_COOKIE = 'true'
  CACHE_STORE = 'database'
  QUEUE_CONNECTION = 'database'
  CORS_ALLOWED_ORIGINS = 'https://tudoaki-sys.vercel.app'

[http_service]
auto_start_machines = true
auto_stop_machines = true
min_machines_running = 0
force_https = true
internal_port = 8080
processes = ["app"]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
